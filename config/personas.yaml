# Seeded personas
#
# Six persona ROLES, and one ACCOUNT per role per collection. The role is
# editorial - who the reader is. The account is the row in the database, and it
# belongs to exactly one collection. See account_isolation below: this is the
# single most important thing in this file.
#
# Stable across sessions: same email, same state, same names. Re-seeding must be
# idempotent - if the account exists, bring it to the state below rather than
# creating a second one.
#
# Sessions are always minted, never pasted:
#   POST /admins/generate-signin-token  {"data": {"email": "<persona email>"}}
# then exchange the custom token for a Firebase ID token. See config/api.md.
#
# Every call below uses the admin API key (X-API-KEY) or the persona's own bearer
# token. Bodies are wrapped in {"data": {...}}. Paths are in config/api.md.
#
# Fixtures that belong to one collection (a throwaway team, a scratch tournament)
# are NOT here. Name those per collection - kb-<collection-id>-<thing> - so two
# collections never fight over the same row.
#
# Email domain: yopmail.com, for every persona. Any domain works for accounts that
# never read their mail, but three flows do read it - email verification (01.2),
# password reset (01.4) and the email reference article (20.2) - and yopmail gives a
# public inbox with no setup: kb-fresh@yopmail.com is readable at
# https://yopmail.com/?kb-fresh. One domain everywhere keeps the specs uniform.
#
# Passwords: admin-created users have none. To give a persona one, create it with
# POST /admins/users, call POST /users/reset-password {"email": "<persona>"}, then
# open the reset link from its yopmail inbox. That covers 01.3 and 01.4 on
# disposable data. The owner's own staging login is the fallback and is recorded in
# local/credentials.md (gitignored) - if it is ever used in a capture, mask name,
# avatar and email per docs/style-guide.md.

conventions:
  email_pattern: "kb-<persona>-<collection>@yopmail.com"   # see account_isolation
  last_name: "KB"
  create: |
    POST /admins/users
    {"data": {"name": "<name>", "lastName": "KB", "email": "<email>"}}
  session: |
    POST /admins/generate-signin-token
    {"data": {"email": "<email>"}}
  membership: |
    POST /admins/change-user-membership/:userId
    {"data": {"membership": "Free" | "Pro"}}

account_isolation:
  # "used_by" on each persona below lists the collections that need that ROLE.
  # It does NOT mean they share an account - each one gets its own address from
  # the pattern.
  rule: >
    One account per persona per collection. A collection seeds ONLY into its own
    accounts. It never seeds into another collection's, and it does not read from
    one either.
  address: "kb-<persona>-<collection>@yopmail.com - kb-organiser-13@yopmail.com, kb-manager-pro-08@yopmail.com"
  exception:
    "12": >
      kb-organiser@yopmail.com, unsuffixed. Collection 12 was captured before this
      rule existed and its 80 published screenshots were taken from that account.
      Renaming it would mean re-capturing them. Leave it alone. Its extra fixture
      accounts, kb-12-admin@ and kb-12-outsider@, already carry the collection id.
  why: >
    Accounts used to be shared by role: one kb-organiser@ served collections 12 to
    16, one kb-manager-pro@ served 07, 08, 09, 10, 17 and 22. Any collection that
    seeds a tournament, team, leaderboard or venue changes what every sibling
    collection's screenshots show.

    This is not hypothetical. Collection 12's own padel pass added two tournaments
    to the organiser's list. Six of its specs waited for "Your Tournaments (2)",
    the heading became (4), and those specs stopped running - the suite that was
    meant to regenerate on demand could not. Comparing fresh captures against the
    published ones afterwards showed 19 of 52 had changed: six visibly, thirteen by
    a hair, and every one of them would have been given a new content hash and a
    new URL.
  what_breaks_what: >
    A collection breaks its siblings by SEEDING. It is broken by PHOTOGRAPHING a
    list of things the account owns. So isolating only the collections that take
    list screenshots is not enough - every seeder sharing that account has to move
    too. That is why the rule is all collections, not a chosen few.
  second_actors: >
    When an article needs a second person - an invited admin, a team owner, an
    outsider who gets Access denied - that account belongs to the collection as
    well: kb-<collection>-<role>@yopmail.com, as collection 12 did with
    kb-12-admin@ and kb-12-outsider@. Do not borrow another collection's persona
    for it, even read-only. Their state is theirs to change.
  cost: >
    Each collection creates its own accounts in its own seed script, so this is
    idempotent seeding work, not a manual setup step. Accounts that need Pro or a
    Tournament Pro grant get it in the same script. Nothing needs to exist before a
    collection's step 1 runs.

personas:

  fresh:
    email_pattern: "kb-fresh-<collection>@yopmail.com"
    name: Fresh
    membership: Free
    used_by: ["01", "07.6"]
    state: >
      A brand-new account that has completed nothing. No teams, no friends, no
      matches, no avatar, no bio. The setup wizard and the profile checklist must
      both still be unfinished.
    seed:
      - "DELETE /admins/user-delete/:userId   # only if the account already exists and has state"
      - "POST /admins/users {\"name\":\"Fresh\",\"lastName\":\"KB\",\"email\":\"kb-fresh@yopmail.com\"}"
    notes: >
      This is the one persona that must be torn down and recreated rather than
      reused, because its value is having no state. Collection 01 also needs the
      real signup and email-verification flow, which the admin create path skips -
      do that one through the UI.

  player:
    email_pattern: "kb-player-<collection>@yopmail.com"
    name: Pia
    membership: Free
    used_by: ["02", "11", "17.8", "19", "20"]   # 03 merged into 02; 17.10 renumbered to 17.8; 06 retired
    state: >
      A member of two teams she does not own, with match history so her statistics,
      rankings and match list are populated. Has an avatar, a banner and a bio.
      Follows one player, one team. Has received at least one payment request
      (for 17.10) and has notifications to read.
    seed:
      - "POST /admins/users"
      - "POST /players/avatar then PUT /users/:userId with the avatarToken"
      - "POST /players/:playerId/banner"
      - "manager_pro adds her: POST /team-players {teamId, name, email, role: Player}"
      - "POST /team-invitations/accept {\"teamInvitationIds\":[...]}  # as player"
      - "manager_pro runs a match to Finished so her stats populate"
      - "POST /players/:playerId/follow and POST /teams/:teamId/follow  # as player"
    notes: >
      Statistics update asynchronously after a match finishes (see article 11.3).
      Seed the match, then poll GET /players/:playerId/stats before capturing.

      ADDED 2026-09-03, by collection 20. "Has notifications to read" is not a
      state that survives a capture run, and collection 20 is the one that
      photographs them. The bell badge and the modal title do not come from
      GET /notifications - that answers a bare array with no counters. They come
      from a Firestore document, notifications/<firebase uid>, and the number in
      it is a running tally rather than a count: mark-all-read SETS it to 0,
      marking rows unread again does NOT put it back, and deleting an unread row
      SUBTRACTS one, so it goes negative and stays there. Article 20.1
      photographs the badge and then presses Mark all as read, which spends it.

      So scripts/seed-20.mjs deletes and remakes Pia's notifications on every
      run - the only thing that raises the tally is a new notification - and it
      has to mark them read BEFORE deleting them, which is what heals a
      negative tally. Run it before every capture of collection 20, not once.
      See briefs/20.md, "Two defects that shape the whole run".

  manager_free:
    email_pattern: "kb-manager-free-<collection>@yopmail.com"
    name: Marc
    membership: Free
    used_by: ["04", "05", "18", "24"]   # 02 is now a player collection; 23 retired
    state: >
      Owns one team on the Free plan, sitting at the Free limits so every gate
      modal is reachable. Has friends in the friends list, one of them with a
      clashing email for the merge flow. In one group chat.
    seed:
      - "POST /admins/users"
      - "POST /admins/change-user-membership/:userId {\"membership\":\"Free\"}"
      - "POST /teams {\"name\":\"KB Free FC\",\"teamSize\":\"5 VS 5\",\"defaultFormation\":{\"formation\":\"2-1-1\"}}"
      - "POST /friends {\"name\":\"...\"} x3"
      - "POST /friends {\"name\":\"...\",\"email\":\"<an email already on a player>\"}  # merge case"
    notes: >
      CORRECTED 2026-08-29, by collection 04. This used to say the Free/Pro pairs
      in collections 04 and 18 were captured by flipping THIS account with
      change-user-membership between the two captures. Do not do that.
      docs/style-guide.md, "Actions you can only do once": a free_pro article gets
      TWO seeded accounts, one Free and one Pro, because a flipped account only
      works if the specs run in one order.

      It fails in two ordinary ways. Collection 04's limits article photographs
      six gates that vanish the moment the account is Pro, so any spec that
      leaves the flip half-done destroys them; and a crash between the flip and
      the flip back leaves the persona Pro for every later run, silently, with
      the specs that do not care still passing.

      So this account stays Free, and its collection seeds a second account that
      is Pro at rest - kb-04-pro@yopmail.com. Where an article documents the
      UPGRADE itself, which cannot be photographed unsubmitted because the app
      has no confirm step, it gets a third, throwaway account whose spec resets
      it: kb-04-upgrade@yopmail.com. Collection 18 did the same.

      CORRECTED 2026-09-02, by collection 18. This used to say chat had no
      endpoint in the collection and that the group chat had to be seeded
      through the UI. Chat has nineteen endpoints - see config/api.md, "Chat and
      messaging" - and scripts/seed-18.mjs builds the whole transcript over the
      API in one pass.

      Collection 18 also found that this account cannot be its capture persona.
      On Free an incoming message arrives as its first ten characters and an
      ellipsis, and replying to one or reacting to one is refused outright with
      403. Marc therefore appears in collection 18 only where the Pro gate is
      the subject; kb-18-pro@yopmail.com takes every other capture. See
      briefs/18.md, "Personas used".

  manager_pro:
    email_pattern: "kb-manager-pro-<collection>@yopmail.com"
    name: Mo
    membership: Pro
    used_by: ["07", "08", "09", "10", "17", "22"]
    state: >
      Owns one full team (6 named players, mixed roles including an Administrator
      and a Fan), one leaderboard containing that team plus one opponent, one
      finished match with goals and cards, one scheduled match, and one saved
      venue. Payout account connected in Stripe test mode for collection 17.
    seed:
      - "POST /admins/users"
      - "POST /admins/change-user-membership/:userId {\"membership\":\"Pro\"}"
      - "POST /teams {\"name\":\"KB United\",\"teamSize\":\"5 VS 5\",\"defaultFormation\":{\"formation\":\"2-1-1\"}}"
      - "POST /team-players x6 with roles Player, Administrator, Fan"
      - "POST /teams {\"name\":\"KB Rovers\", ...}  # the opponent"
      - "POST /leaderboards {\"name\":\"KB Sunday League\"}"
      - "POST /leaderboards/:id/teams {\"teamId\":\"...\"} x2"
      - "POST /club-locations {\"name\":\"KB Astro\",\"location\":\"...\"}"
      - "POST /matches {homeTeam, awayTeam, date, duration, clubLocationId, tag}"
      - "POST /matches/:matchId/status {\"status\":\"Live\"} -> events -> {\"status\":\"Finished\"}"
      - "POST /payments/stripe/account  # 17 only, test mode"
    notes: >
      Collection 17 needs a real Stripe Connect onboarding (17.2 is the hardest
      capture in the project). Stripe test mode only. Do not enter real details.

  organiser:
    email_pattern: "kb-organiser-<collection>@yopmail.com"
    # Collection 12 is the one exception: kb-organiser@yopmail.com, unsuffixed,
    # because its published screenshots were captured from it. See
    # account_isolation.exception at the top of this file.
    name: Oona
    membership: Pro
    tournament_plan: Pro
    used_by: ["12", "13", "14", "15", "16"]
    state: >
      Holds Tournament Pro granted without Stripe, plus one tournament in each
      state the articles need: one Draft mid-wizard, one Published with groups and
      a full fixture list, one Live, one Completed. Owns four teams to fill a
      group, and two venues.
    seed:
      - "POST /admins/users"
      - "POST /admins/change-user-membership/:userId {\"membership\":\"Pro\"}"
      - "POST /admins/users/tournament-free-pro/grant {\"email\":\"<this collection's organiser>\",\"plan\":\"Pro\",\"quantity\":2}"
      - "POST /club-locations x2"
      - "POST /teams x4 with players"
      - "POST /tournaments {\"title\":\"KB Cup\",\"startDate\":\"...\",\"endDate\":\"...\",\"isOnline\":false}"
      - "PATCH /tournaments/:id/config {startDate, endDate, clubLocationIds, teamIds, teamCount, format, groupCount, teamsPerGroup, matchesPerTeam, isComplete}"
      - "PATCH /tournaments/:id/schedule {matches:[...]}"
    notes: >
      Requires the TOURNAMENT_FEATURE_ENABLED flag.
      Collection 16 is real money on the Basic/Pro/Annual plans - use a SECOND
      organiser account without the free grant so the paywall is reachable, and
      Stripe test mode. Name it kb-16-organiser-basic@yopmail.com - a second actor
      inside collection 16, not a shared persona.
      TODO: publishing, phases, brackets and the presentation editor have no
      endpoints in the collection. Drive those through the UI and record the steps.

  referee:
    email_pattern: "kb-referee-<collection>@yopmail.com"
    name: Rae
    membership: Free
    used_by: ["21", "09.6"]   # was 09.7 before collection 09 was filtered
    state: >
      A referee profile with at least one accepted assignment on a manager_pro
      match, one pending invitation, and enough finished matches to populate
      referee statistics.
    seed:
      - "POST /admins/users  # then set the referee profile"
      - "manager_pro assigns her to a match, then she accepts"
      - "GET /referees/:playerId/matches to confirm the assignment landed"
    notes: >
      TODO: the Postman collection has no referee-registration endpoint. The only
      trace is defaultProfile: "Referee" on POST /users. Confirm how an existing
      account becomes a referee, through the UI if needed, and record it.
