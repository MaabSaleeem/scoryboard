      - {id: "04.5", title: "Upgrading a tournament to Tournament Pro", flags: [tourn_plan, money], shots: 5, note: "was 16.3 and 16.4. Capture STOPS at the last Scoryboard screen - Continue with PRO and Start with ANNUAL both hand off to a Stripe embedded checkout."}
      - {id: "04.6", title: "Free Tournament Pro slots", flags: [tourn_plan], shots: 2, note: "was 16.6. No money. Granted with the admin API."}

