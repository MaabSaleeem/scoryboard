    articles:
      - {id: "14.1", title: "How the fixture list is generated for a football tournament", shots: 5, note: "flat list per group, one match per slot - 10:00, 10:10, 10:20"}
      - {id: "14.2", title: "How the fixture list is generated for a padel tournament", shots: 5, note: "ROUND 1, ROUND 2 ...; matches in a round share a start time and carry a court number"}
      - {id: "14.3", title: "Bulk-scheduling a football group, and the gap between matches", flags: [role], shots: 5}
      - {id: "14.4", title: "Bulk-scheduling padel rounds, courts and the gap between rounds", flags: [role], shots: 5}
      - {id: "14.5", title: "Rescheduling, rolling and deleting fixtures", flags: [role], shots: 6, note: "SHARED. Same controls on both - SELECT MATCH TO UPDATE, BULK MATCH UPDATE."}
      - {id: "14.6", title: "Why two football fixtures clash, and fixtures showing only one team", shots: 4}
      - {id: "14.7", title: "Why padel matches share a start time, and when that is a clash", shots: 4, note: "simultaneous matches on different courts are intended here - the football clash article is wrong for padel"}
      - {id: "14.8", title: "Exporting your fixture list as a PDF", shots: 3, note: "SHARED. Same EXPORT FIXTURES control on both."}

