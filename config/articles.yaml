    persona_default: manager_free
    note: "Two different products live on the /subscriptions screen and this collection covers both. Platform Pro (04.1-04.3) is the account's own membership and is a free self-serve toggle during beta, no payment step. Tournament Pro (04.4-04.6) is per-tournament and is REAL MONEY. Collection 16 was retired into this collection on 2026-08-29. Flag for rewrite when the beta ends."
    articles:
      - {id: "04.1", title: "Free vs Pro - what is included", flags: [free_pro], shots: 4}
      - {id: "04.2", title: "Pro is free during beta - how to upgrade", flags: [free_pro], shots: 5}
      - {id: "04.3", title: "Every Free-plan limit, and the messages you will see", flags: [free_pro], shots: 8, note: "canonical limits table, other articles link here"}
