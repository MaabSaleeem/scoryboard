  - id: "13"
    name: Tournaments - groups, brackets & phases
    persona_default: organiser
    feature_flag: TOURNAMENT_FEATURE_ENABLED
    note: "Football and Padel diverge on almost every screen here - group controls, bracket seeding, standings columns. Split at article level, verified in the app 2026-08-28. Only the phases article is shared."
    articles:
      - {id: "13.1", title: "How teams are distributed into groups in a football tournament", shots: 4}
      - {id: "13.2", title: "How pairs are created and grouped in a padel tournament", shots: 4, note: "pairs are generated from the player count as Player 1 & Player 2; one group, not several"}
      - {id: "13.3", title: "Editing and deleting a group in a football tournament", flags: [role], shots: 5}
      - {id: "13.4", title: "Editing a group in a padel tournament", flags: [role], shots: 4, note: "padel groups have Edit but no Delete - removing the structure means deleting the format"}
      - {id: "13.5", title: "Reading the group standings table in a football tournament", shots: 3, note: "columns PLD W D L PTS GF GA GD"}
      - {id: "13.6", title: "Reading the group standings table in a padel tournament", shots: 3, note: "columns PLD SCORE W D L PTS - no goals"}
      - {id: "13.7", title: "Brackets and knockout rounds in a football tournament", flags: [role], shots: 6}
      - {id: "13.8", title: "Brackets in a padel tournament, and filling them automatically", flags: [role], shots: 6, note: "slots arrive pre-seeded (1st Group A, Winner Match ...); Fill automatically and Clear have no football equivalent"}
      - {id: "13.9", title: "Setting and renaming bracket matches in a football tournament", flags: [role], shots: 5, note: "football fills slots by hand - Add team to slot"}
      - {id: "13.10", title: "Changing a padel format after you have saved it", flags: [role], shots: 5, note: "PADEL ONLY. The Configuration sub-tab on Format - standings type, scoring, rounds, courts. Football has no such tab. Contents not yet read."}
      - {id: "13.11", title: "Tournament phases - preview, start, end and undo", flags: [role], shots: 9, note: "SHARED. Phase controls are driven by having two phases, not by sport. Needs a football group-and-knockout fixture - a group-only tournament shows none of this."}

