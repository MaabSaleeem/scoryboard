# Intercom collection IDs
#
# Fill each id in before publishing that collection. Step 2 refuses to publish
# into an empty id.
#
# Get the ids from the Intercom Help Center admin, or:
#   GET https://api.intercom.io/help_center/collections
#   Authorization: Bearer $INTERCOM_ACCESS_TOKEN
#
# Keys are the collection numbers from config/articles.yaml. Do not renumber them.
#
# Workspace confirmed 2026-08-28: Scoryboard (pzf0spnb), region US, one help centre,
# default locale en, website_turned_on: false (the help centre is not live yet).
# The workspace has NO collections. All 24 below must be created once, before the
# first publish:
#   POST https://api.intercom.io/help_center/collections
#   {"name": "<name>", "help_center_id": 5705778}
# Write the returned id into the matching row here and commit that change.
#
# Articles need an author_id, and default to state "draft". Publish explicitly:
#   POST https://api.intercom.io/articles
#   {"title": "...", "body": "<html>", "author_id": 11443412,
#    "state": "published", "parent_id": <collection id>, "parent_type": "collection"}
# An article is only visible in the help centre if it sits in a collection.
#
# The 24 collections below were created 2026-08-28 and verified: all top-level
# (parent_id null), all in help centre 5705778, order 0-23 matching 01-24.
#
# Intercom HTML-escapes names in API responses: "Plans &amp; membership". The
# stored value is a plain "&" - the url slug (".../19733973-plans-and-membership")
# confirms it. Never write a name you read back from the API; that would store the
# escaped form. Names here are the source of truth.

help_center_id: "5705778"
default_locale: "en"
author_id: "11443412"

collections:
